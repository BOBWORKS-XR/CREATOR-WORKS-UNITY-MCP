name: Windows installer acceptance (test only)

on:
  # New workflows cannot be manually dispatched until present on the default branch.
  # Only an explicitly approved test-branch push may start this first acceptance run.
  push:
    branches:
      - feature/creator-hub-compatibility
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-startup:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify test process startup on Windows PowerShell
        shell: powershell
        run: |
          .\test\fixtures\owned-node-startup.ps1 -NodePath (Get-Command node.exe).Source
          $baseline = Join-Path $env:RUNNER_TEMP 'mcp-baseline.exe'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/BOBWORKS-XR/CREATOR-WORKS-UNITY-MCP/releases/download/v2.6.0/Creator.Works.MCP_2.6.0_x64-setup.exe' -OutFile $baseline
          if ((Get-FileHash -LiteralPath $baseline -Algorithm SHA256).Hash.ToLowerInvariant() -ne '11d6fc0fb95e33023a90a8722cf9234f82de6e175689bd915401bac3d49bc8c2') { throw 'Baseline hash mismatch.' }
          $out = Join-Path $env:RUNNER_TEMP 'Legacy Creator Works MCP'
          & 7z.exe x $baseline ('-o' + $out) 'server/runtime/node.exe' '-y' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Baseline runtime extraction failed.' }
          .\test\fixtures\owned-node-startup.ps1 -NodePath (Join-Path $out 'server\runtime\node.exe')
  build-candidate:
    needs: fixture-startup
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      installer-sha256: ${{ steps.inputs.outputs.installer-sha256 }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: npm run check:version
      - run: npm run release:launcher
      - name: Read reviewed license tooling revision
        id: notices
        shell: pwsh
        run: |
          $pin = Get-Content scripts/notices-tool.json -Raw | ConvertFrom-Json
          "revision=$($pin.revision)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v6
        with:
          repository: BOBWORKS-XR/CREATOR-HUB
          ref: ${{ steps.notices.outputs.revision }}
          path: artifacts/notices-tool
          persist-credentials: false
      - run: node scripts/prepare-installer-notices.mjs
      - run: npm audit --audit-level=low
      - run: cargo test --release
        working-directory: launcher/src-tauri
      - run: npx --yes @tauri-apps/cli@2.9.6 build --bundles nsis --config ../release/tauri-notices.json -- --locked
        working-directory: launcher
      - name: Record exact candidate and build input hashes
        id: inputs
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $directory = 'launcher/src-tauri/target/release/bundle/nsis'
          $installer = Join-Path $directory "Creator Works MCP_${version}_x64-setup.exe"
          $pairs = [ordered]@{
            'server/runtime/node.exe' = 'release/runtime/node.exe'
            'server/runtime/node' = 'release/runtime/node'
            'server/creator-works-mcp.mjs' = 'release/creator-works-mcp.mjs'
            'server/unity-extension/Editor/BanterMCPBridge.cs' = 'unity-extension/Editor/BanterMCPBridge.cs'
            'licenses/LICENSE.txt' = 'release/licenses/LICENSE.txt'
            'licenses/THIRD_PARTY_NOTICES.txt' = 'release/licenses/THIRD_PARTY_NOTICES.txt'
            'licenses/rust-dependencies.json' = 'release/licenses/rust-dependencies.json'
            'licenses/node-dependencies.json' = 'release/licenses/node-dependencies.json'
          }
          $files = @($pairs.GetEnumerator() | ForEach-Object {
            @{ path = $_.Key; sha256 = (Get-FileHash -LiteralPath $_.Value -Algorithm SHA256).Hash.ToLowerInvariant() }
          })
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $stopHash = (Get-FileHash -LiteralPath 'launcher/src-tauri/windows/installer-runtime-stop.ps1' -Algorithm SHA256).Hash.ToLowerInvariant()
          @{ schemaVersion = 1; version = $version; sourceCommit = $env:GITHUB_SHA; installerSha256 = $hash; runtimeStopSha256 = $stopHash; files = $files } |
            ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $directory 'acceptance-inputs.json')
          "installer-sha256=$hash" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-windows-candidate-under-test
          path: |
            launcher/src-tauri/target/release/bundle/nsis/*-setup.exe
            launcher/src-tauri/target/release/bundle/nsis/acceptance-inputs.json
          if-no-files-found: error

  installed-upgrade:
    needs: build-candidate
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        baseline: ['2.6.0', '2.7.0-alpha.1', '2.7.0-alpha.2', '2.7.0']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: mcp-windows-candidate-under-test
          path: launcher/src-tauri/target/release/bundle/nsis
      - name: Fetch the previously accepted alpha 2 baseline
        if: matrix.baseline == '2.7.0-alpha.2'
        uses: actions/download-artifact@v4
        with:
          name: mcp-windows-prerelease-candidate
          run-id: 34985053768
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/accepted-alpha2-baseline
      - name: Native installed upgrade on disposable runner only
        shell: powershell
        env:
          EXPECTED_INSTALLER_SHA256: ${{ needs.build-candidate.outputs.installer-sha256 }}
          BASELINE_VERSION: ${{ matrix.baseline }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $extra = @{}
          if ($env:BASELINE_VERSION -ceq '2.7.0-alpha.2') { $extra.BaselineInstaller = 'artifacts\accepted-alpha2-baseline\Creator Works MCP_2.7.0-alpha.2_x64-setup.exe' }
          .\scripts\test-installed-upgrade-ci.ps1 -Installer "launcher\src-tauri\target\release\bundle\nsis\Creator Works MCP_${version}_x64-setup.exe" -BaselineVersion $env:BASELINE_VERSION -ExpectedInstallerSha256 $env:EXPECTED_INSTALLER_SHA256 @extra
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer-acceptance-${{ matrix.baseline }}
          path: artifacts/installed-upgrade-ci/
          if-no-files-found: warn

  accepted-candidate:
    needs: [build-candidate, installed-upgrade]
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mcp-windows-candidate-under-test
          path: accepted
      - name: Verify the accepted installer is unchanged
        shell: pwsh
        env:
          EXPECTED_INSTALLER_SHA256: ${{ needs.build-candidate.outputs.installer-sha256 }}
        run: |
          $installers = @(Get-ChildItem -LiteralPath accepted -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected one accepted installer.' }
          if ((Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:EXPECTED_INSTALLER_SHA256) { throw 'Accepted installer changed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-windows-stable-candidate
          path: accepted/*-setup.exe
          if-no-files-found: error
