name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Node ${{ matrix.node }} MCP server
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Use supported npm audit client
        if: matrix.node == 20
        run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm test
      - run: npm run release:server
      - run: npm run check:version
      - if: matrix.node == 20
        run: npm audit --audit-level=low

  launcher-windows:
    name: Tauri launcher (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release:launcher
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-standalone.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\smoke-setup.ps1
      - run: cargo fmt --check
        working-directory: launcher/src-tauri
      - run: cargo test
        working-directory: launcher/src-tauri
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File .\setup.ps1 -Help

  launcher-linux:
    name: Tauri launcher (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install Rust + Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            file
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.9.6 --locked
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri -> target
      - run: npm ci
      - run: npm run release:launcher
      - run: NO_STRIP=1 cargo tauri build
      - run: npm run build:standalone
      - run: cargo fmt --check
        working-directory: launcher/src-tauri
      - run: cargo test
        working-directory: launcher/src-tauri
      - name: Smoke-test setup.sh
        run: ./setup.sh help
      - name: Smoke-test setup.mjs install
        run: node scripts/cli/setup.mjs install

  launcher-macos:
    name: Tauri launcher (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.9.6 --locked
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri -> target
      - run: npm ci
      - run: npm run release:launcher
      - run: cargo tauri build --bundles dmg
      - run: npm run build:standalone
      - run: cargo fmt --check
        working-directory: launcher/src-tauri
      - run: cargo test
        working-directory: launcher/src-tauri
      - name: Smoke-test setup.sh
        run: ./setup.sh help
      - name: Smoke-test setup.mjs install
        run: node scripts/cli/setup.mjs install

