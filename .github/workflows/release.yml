name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    # Previews and reviewed Windows 2.7.x releases promote exact accepted artifacts.
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && (!contains(github.ref_name, '-') || github.event_name == 'workflow_dispatch') && github.ref_name != 'v2.7.0' && github.ref_name != 'v2.7.1' && github.ref_name != 'v2.7.2' }}
    name: Windows installer and standalone bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci
      - run: npm test
      - run: npm run check:version
      - run: npm run release:launcher
      - run: npm audit --audit-level=low
      - run: cargo test
        working-directory: launcher/src-tauri

      - name: Build standalone ZIP
        shell: powershell
        run: .\scripts\build-standalone.ps1

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: launcher
          tagName: ${{ github.ref_name }}
          releaseName: "Creator Works MCP __VERSION__"
          releaseBody: "Creator Works MCP packages the server, Unity bridge, and a private Node.js 24 LTS runtime for Windows, Linux, and macOS. Windows packages are unsigned and macOS packages are not notarized. Save your work and close MCP clients if Setup asks. The standalone ZIP remains available for manual Node.js 20+ deployments. See the tagged README and version-specific release notes for benefits, profile choices, and acceptance limits."
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: "--bundles nsis"

      - name: Attach standalone ZIP and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $standalone = Get-Item "release\Creator-Works-MCP-$version-standalone.zip"
          $installers = @(Get-ChildItem "launcher\src-tauri\target\release\bundle" -Recurse -File | Where-Object { $_.Extension -eq ".exe" })
          $artifacts = @($standalone) + $installers
          $checksums = foreach ($artifact in $artifacts) {
            $hash = (Get-FileHash $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            # GitHub normalizes spaces in release asset names to periods.
            $releaseAssetName = $artifact.Name.Replace(" ", ".")
            "$hash  $releaseAssetName"
          }
          $checksumPath = Join-Path $PWD "release\SHA256SUMS.txt"
          [System.IO.File]::WriteAllLines($checksumPath, $checksums, [System.Text.UTF8Encoding]::new($false))
          $standalonePath = $standalone.FullName.Replace('\', '/')
          $checksumUploadPath = $checksumPath.Replace('\', '/')
          $maxAttempts = 5
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            gh release upload "${{ github.ref_name }}" $standalonePath $checksumUploadPath --clobber --repo "${{ github.repository }}"
            if ($LASTEXITCODE -eq 0) {
              break
            }
            if ($attempt -eq $maxAttempts) {
              throw "Release asset upload failed after $maxAttempts attempts."
            }
            $delaySeconds = 5 * [math]::Pow(2, $attempt - 1)
            Write-Warning "Release asset upload attempt $attempt failed; retrying in $delaySeconds seconds."
            Start-Sleep -Seconds $delaySeconds
          }

  linux:
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && (!contains(github.ref_name, '-') || github.event_name == 'workflow_dispatch') && github.ref_name != 'v2.7.0' && github.ref_name != 'v2.7.1' && github.ref_name != 'v2.7.2' }}
    name: Linux AppImage, DEB, and RPM bundle
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install Rust + Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            file
      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci
      - run: npm test
      - run: npm run check:version
      - run: npm run release:launcher
      - run: npm audit --audit-level=low
      - run: cargo test
        working-directory: launcher/src-tauri

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: 1
        with:
          projectPath: launcher
          tagName: ${{ github.ref_name }}
          releaseName: "Creator Works MCP __VERSION__"
          releaseBody: "Creator Works MCP packages the server, Unity bridge, and a private Node.js 24 LTS runtime for Windows, Linux, and macOS. Windows packages are unsigned and macOS packages are not notarized. Save your work and close MCP clients if Setup asks. The standalone ZIP remains available for manual Node.js 20+ deployments. See the tagged README and version-specific release notes for benefits, profile choices, and acceptance limits."
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: "--bundles appimage,deb,rpm"

  macos:
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && (!contains(github.ref_name, '-') || github.event_name == 'workflow_dispatch') && github.ref_name != 'v2.7.0' && github.ref_name != 'v2.7.1' && github.ref_name != 'v2.7.2' }}
    name: macOS DMG bundle (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: Apple silicon
          - os: macos-15-intel
            label: Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci
      - run: npm test
      - run: npm run check:version
      - run: npm run release:launcher
      - run: npm audit --audit-level=low
      - run: cargo test
        working-directory: launcher/src-tauri

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: launcher
          tagName: ${{ github.ref_name }}
          releaseName: "Creator Works MCP __VERSION__"
          releaseBody: "Creator Works MCP packages the server, Unity bridge, and a private Node.js 24 LTS runtime for Windows, Linux, and macOS. Windows packages are unsigned and macOS packages are not notarized. Save your work and close MCP clients if Setup asks. The standalone ZIP remains available for manual Node.js 20+ deployments. See the tagged README and version-specific release notes for benefits, profile choices, and acceptance limits."
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: "--bundles dmg"

  verify-macos:
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && (!contains(github.ref_name, '-') || github.event_name == 'workflow_dispatch') && github.ref_name != 'v2.7.0' && github.ref_name != 'v2.7.1' && github.ref_name != 'v2.7.2' }}
    name: Verify macOS DMG (${{ matrix.label }})
    needs: macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: Apple silicon
            asset_arch: aarch64
            binary_arch: arm64
          - os: macos-15-intel
            label: Intel
            asset_arch: x64
            binary_arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Verify exact draft DMG signature and architecture
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          BINARY_ARCH: ${{ matrix.binary_arch }}
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          asset="Creator.Works.MCP_${version}_${ASSET_ARCH}.dmg"
          release=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,assets)
          [[ $(jq -r '.isDraft' <<<"$release") == true ]] || { echo 'Expected a draft release' >&2; exit 1; }
          digest=$(jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .digest' <<<"$release")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Missing DMG digest' >&2; exit 1; }
          folder="$RUNNER_TEMP/mcp-release-dmg"
          mkdir -p "$folder" "$folder/mounted"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$folder"
          actual=$(shasum -a 256 "$folder/$asset" | awk '{print $1}')
          [[ "$actual" == "${digest#sha256:}" ]] || { echo 'DMG digest mismatch' >&2; exit 1; }
          hdiutil attach -readonly -nobrowse -mountpoint "$folder/mounted" "$folder/$asset"
          trap 'hdiutil detach "$folder/mounted"' EXIT
          app=$(find "$folder/mounted" -maxdepth 1 -type d -name '*.app' -print -quit)
          [[ -n "$app" ]] || { echo 'DMG has no app bundle' >&2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          executable=$(plutil -extract CFBundleExecutable raw -o - "$app/Contents/Info.plist")
          architectures=$(lipo -archs "$app/Contents/MacOS/$executable")
          [[ " $architectures " == *" $BINARY_ARCH "* ]] || { echo "Unexpected executable architecture: $architectures" >&2; exit 1; }
          printf 'Verified %s: %s, %s, code signature valid\n' "$asset" "$actual" "$architectures"

  checksums:
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && github.ref_name != 'v2.7.0' && github.ref_name != 'v2.7.1' && github.ref_name != 'v2.7.2' }}
    name: Consolidate SHA256 checksums
    runs-on: ubuntu-latest
    needs: [windows, linux, macos, verify-macos]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Compute consolidated checksums and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          max_attempts=5
          for attempt in $(seq 1 $max_attempts); do
            if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json assets > release-assets.json &&
               node scripts/release-checksums.mjs release-assets.json > SHA256SUMS.txt; then
              break
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Release asset query returned empty after $max_attempts attempts." >&2
              exit 1
            fi
            delay=$((5 * 2 ** (attempt - 1)))
            echo "Release asset query attempt $attempt empty; retrying in $delay seconds..." >&2
            sleep $delay
          done

          for attempt in $(seq 1 $max_attempts); do
            if gh release upload "${{ github.ref_name }}" SHA256SUMS.txt --clobber --repo "${{ github.repository }}"; then
              break
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Release checksum upload failed after $max_attempts attempts." >&2
              exit 1
            fi
            delay=$((5 * 2 ** (attempt - 1)))
            echo "Release checksum upload attempt $attempt failed; retrying in $delay seconds..." >&2
            sleep $delay
          done

          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"

          # The REST by-tag endpoint cannot resolve a draft; gh release view can.
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json assets --jq '.assets[] | "\(.apiUrl) \(.name)"' | while read -r asset_api_url asset_name; do
            label=""
            case "$asset_name" in
              *.exe)
                label="Creator-Works-MCP-${VERSION}-windows-x64-setup.exe"
                ;;
              *aarch64.dmg)
                label="Creator-Works-MCP-${VERSION}-macos-arm64.dmg"
                ;;
              *x64.dmg)
                label="Creator-Works-MCP-${VERSION}-macos-x64.dmg"
                ;;
              *.AppImage)
                label="Creator-Works-MCP-${VERSION}-linux-x86_64.AppImage"
                ;;
              *.deb)
                label="Creator-Works-MCP-${VERSION}-linux-amd64.deb"
                ;;
              *.rpm)
                label="Creator-Works-MCP-${VERSION}-1-linux.x86_64.rpm"
                ;;
              *-standalone.zip)
                label="Creator-Works-MCP-${VERSION}-standalone.zip"
                ;;
            esac
            if [ -n "$label" ]; then
              gh api -X PATCH "$asset_api_url" -f label="$label" >/dev/null
            fi
          done

